<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://unpkg.com/gutenberg-css@0.6" />
    <style>
      table {
        width: 100%;
      }
      footer {
        text-align: center;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>Library Students</h1>

    <table>
      <thead>
        <tr>
          <th>Student ID</th>
          <th>Name</th>
          <th>Class</th>
          <th>Books Borrowed</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>101</td>
          <td>John Doe</td>
          <td>Grade 10</td>
          <td>2</td>
        </tr>
        <tr>
          <td>102</td>
          <td>Jane Smith</td>
          <td>Grade 11</td>
          <td>3</td>
        </tr>
      </tbody>
    </table>

    <footer>This is a student table template for a library</footer>
  </body>
</html>
